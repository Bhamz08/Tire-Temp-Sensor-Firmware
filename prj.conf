# Zephyr subsystems this app uses. Board-independent.
CONFIG_I2C=y
CONFIG_CAN=y
CONFIG_GPIO=y
# Software CRC library; provides crc8_ccitt() for the MLX90614 PEC check.
# Off by default in Zephyr 4.5.
CONFIG_CRC=y

# Log messages go to the board's serial console (ST-LINK virtual COM port
# on the Nucleo).
CONFIG_LOG=y
